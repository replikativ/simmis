name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # The full backend gate already takes ~30 minutes including dependency
    # preparation (PR70: 29m53s). Leave bounded headroom for setup/runtime
    # variance; do not drop tests or hide individual assertion failures.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Install audio and MCP helper dependencies
        # A cold Ubuntu mirror can spend >5m transferring ffmpeg's dependency
        # closure before any tests start. Keep setup separately bounded; apt
        # requests still have their own timeouts/retry limits in the script.
        timeout-minutes: 15
        run: |
          # Azure's mirror has repeatedly exhausted setup's transfer budget.
          # Keep Ubuntu's signed suites/keyring, changing only that exact URI.
          sudo python3 scripts/ci_ubuntu_mirror.py
          bash scripts/install-test-helpers.sh

      - name: Prepare backend dependencies
        run: clojure -X:deps prep

      - name: Run backend tests
        run: clojure -X:test :reporter kaocha.report/documentation

  helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test private MCP and worker helpers
        run: python3 -m unittest discover -s test/scripts

  worker-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Prepare Git dependency Java interfaces
        run: clojure -J-Xmx1g -X:deps prep
      - name: Build dedicated local SCI runtime
        run: clojure -J-Xmx1g -T:build worker
      - name: Select the configured JDK for the fixed local bootstrap
        run: |
          /usr/bin/java -version
          java -version
          sudo update-alternatives --install /usr/bin/java java "$JAVA_HOME/bin/java" 100
          sudo update-alternatives --set java "$JAVA_HOME/bin/java"
          /usr/bin/java -version
      - name: Cold credential-free runtime preflight
        run: SIMMIS_WORKER_JAR="$(realpath target/simmis-*-worker.jar)" python3 -m unittest discover -s test/scripts -p test_worker_runtime_smoke.py

  frontend-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Cache Clojure dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: frontend-clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            frontend-clojure-${{ runner.os }}-
            clojure-${{ runner.os }}-
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: |
          clojure -X:deps prep
          npm run release

      - name: Execute client lifecycle tests in Chrome
        run: npm run test:browser

  # Preserve the original required-check name while independent jobs still
  # report their results when another gate fails.
  test-and-build:
    needs: [backend-tests, helper-tests, worker-package, frontend-tests-and-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test '${{ needs.backend-tests.result }}' = success
          test '${{ needs.helper-tests.result }}' = success
          test '${{ needs.worker-package.result }}' = success
          test '${{ needs.frontend-tests-and-build.result }}' = success
