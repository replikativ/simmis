version: 2.1

# Test gates for pull requests: JVM/Python suites, executed CLJS browser tests,
# and a production frontend build (`release` checks :advanced compilation).
#
# `clojure -X:test` and not -M: the :test alias uses :exec-fn, and -M:test
# silently opens a REPL, which in CI looks like a hang or, worse, a pass.
#
# No auto-deploy. Deploying is a deliberate act.

orbs:
  tools: replikativ/clj-tools@0
  browser-tools: circleci/browser-tools@2.4.2
  node: circleci/node@7.2.1

jobs:
  test:
    docker:
      - image: cimg/clojure:1.12.1-openjdk-21.0-node
    resource_class: large
    # Separate containers keep process-global fixtures isolated. Two shards
    # exceeded Circle's 60m limit; retain every namespace across four shards.
    parallelism: 4
    steps:
      - checkout
      - run:
          name: Install audio and MCP helper dependencies
          # A cold ffmpeg dependency closure is ~100MB. Circle's Ubuntu mirror
          # measured 60–123KB/s (14–28 minutes of download alone). Bound setup
          # separately; do not spend or extend the actual test timeout here.
          command: timeout 35m bash scripts/install-test-helpers.sh
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "deps.edn" }}
            - deps-v1-
      - run:
          name: Prepare backend dependencies
          command: clojure -X:deps prep
          no_output_timeout: 15m
      - run:
          name: Run JVM tests (Maven baseline)
          command: clojure -X:test is.simm.ci-runner/run! :reporter kaocha.report/documentation :plugins '[:kaocha.plugin/profiling :is.simm.ci-metrics/metrics]' :kaocha.plugin.profiling/count 20
          no_output_timeout: 15m
      - store_artifacts:
          path: target/ci-timings
          destination: test-timings
      - store_artifacts:
          path: target/ci-partitions
          destination: test-partitions
      - save_cache:
          key: deps-v1-{{ checksum "deps.edn" }}
          paths:
            - ~/.m2
            - ~/.gitlibs

  helpers:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Test private MCP and worker helpers
          command: python3 -m unittest discover -s test/scripts

  worker-package:
    docker:
      - image: cimg/clojure:1.12.1-openjdk-21.0-node
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "deps.edn" }}
            - deps-v1-
      - run:
          name: Prepare worker dependencies and build the dedicated runtime
          command: |
            clojure -J-Xmx1g -X:deps prep
            clojure -J-Xmx1g -T:build worker
          no_output_timeout: 15m
      - run:
          name: Select the configured JDK for the fixed local bootstrap
          command: |
            configured_java="$(realpath "$(command -v java)")"
            sudo update-alternatives --install /usr/bin/java java "$configured_java" 100
            sudo update-alternatives --set java "$configured_java"
            /usr/bin/java -version
      - run:
          name: Cold credential-free packaged runtime preflight
          command: SIMMIS_WORKER_JAR="$(realpath target/simmis-*-worker.jar)" python3 -m unittest discover -s test/scripts -p test_worker_runtime_smoke.py
          no_output_timeout: 5m

  frontend:
    docker:
      - image: cimg/clojure:1.12.1-openjdk-21.0-node
    resource_class: large
    steps:
      - checkout
      - browser-tools/install_chrome
      - node/install:
          node-version: '22'
      - restore_cache:
          keys:
            - frontend-deps-v1-{{ checksum "deps.edn" }}
            - deps-v1-
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Build production frontend
          command: |
            clojure -X:deps prep
            npm run release
          no_output_timeout: 20m
      - run:
          name: Execute client lifecycle tests in Chrome
          command: SIMMIS_TEST_CHROME_NO_SANDBOX=1 npm run test:browser
          no_output_timeout: 15m
      # Keep the production bundle built above available for deployment without
      # another memory-heavy workstation build. Browser tests write to target/.
      - store_artifacts:
          path: public
          destination: frontend
      - save_cache:
          key: frontend-deps-v1-{{ checksum "deps.edn" }}
          paths:
            - ~/.m2
            - ~/.gitlibs
            - node_modules

  uberjar:
    docker:
      - image: cimg/clojure:1.12.1-openjdk-21.0-node
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "deps.edn" }}
            - deps-v1-
      - run:
          name: Build standalone uberjar
          command: |
            npm ci
            clojure -X:deps prep
            clojure -T:build uber
          no_output_timeout: 30m
      - store_artifacts:
          path: target
          destination: jars

workflows:
  build-and-test:
    jobs:
      - test
      - helpers
      - worker-package
      - frontend
      - uberjar:
          requires:
            - test
            - helpers
            - worker-package
            - frontend
          filters:
            branches:
              only: main
